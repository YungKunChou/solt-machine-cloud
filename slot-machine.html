<head>

    <style>
        body { font-family: 'Noto Sans TC', sans-serif; background-color: #F8F7F5; color: #4A4A4A; transition: background-color 0.5s ease, color 0.5s ease; }
        .section-container { background-color: #FFFFFF; border-radius: 12px; padding: 2.5rem; margin-bottom: 2rem; box-shadow: 0 8px 20px rgba(0, 0, 0, 0.07); border: 1px solid #EAEAEA; transition: all 0.5s ease; }
        h2 { font-family: 'Noto Sans TC', sans-serif; font-weight: 500; font-size: 1.75rem; margin-bottom: 1.5rem; padding-bottom: 0.75rem; border-bottom: 2px solid #EAEAEA; color: #333; transition: color 0.5s ease, border-color 0.5s ease; }
        h3 { font-family: 'Noto Sans TC', sans-serif; font-weight: 500; font-size: 1.25rem; margin-bottom: 1rem; padding-bottom: 0.5rem; border-bottom: 1px solid #EAEAEA; color: #333; }
        .btn { padding: 0.6rem 1.2rem; border-radius: 8px; font-weight: 500; cursor: pointer; transition: all 0.3s ease; border: none; box-shadow: 0 4px 6px rgba(0,0,0,0.1); }
        .btn-primary { background-color: #8D7B68; color: white; }
        .btn-primary:hover { background-color: #A4907C; transform: translateY(-2px); box-shadow: 0 6px 8px rgba(0,0,0,0.1); }
        .btn-secondary { background-color: #EFEFEF; color: #4A4A4A; }
        .btn-secondary:hover { background-color: #E0E0E0; }
        .btn-danger { background-color: #D9534F; color: white; }
        .btn-danger:hover { background-color: #C9302C; }
        .input-field { border: 1px solid #D1D5DB; border-radius: 8px; padding: 0.6rem 1rem; transition: border-color 0.3s ease, box-shadow 0.3s ease, background-color 0.3s ease, color 0.3s ease; width: 100%; }
        .input-field:focus { outline: none; border-color: #8D7B68; box-shadow: 0 0 0 3px rgba(141, 123, 104, 0.2); }
        #slot-machine-wrapper { display: flex; justify-content: center; align-items: center; padding-bottom: 2rem; perspective: 1000px; }
        .slot-machine { position: relative; width: min(600px, 100%); aspect-ratio: 1; height: auto; background-image: url('slot-machine.png'); background-size: contain; background-repeat: no-repeat; background-position: center; container-type: inline-size; }
        .slot-window-wrapper { position: absolute; top: 26.9%; left: 19.4%; width: 60%; height: 26.2%; display: flex; justify-content: center; align-items: center; }
        .slot-window { width: 100%; height: 100%; background-color: rgba(248, 247, 245, 0.9); border-radius: 5px; overflow: hidden; position: relative; border: 3px solid #333; box-shadow: inset 0 0 15px rgba(0,0,0,0.5); display: flex; container-type: inline-size; }
        .slot-window::before, .slot-window::after { content: ''; position: absolute; top: 0; left: 0; width: 100%; height: 20%; z-index: 2; pointer-events: none; background: linear-gradient(to bottom, rgba(0,0,0,0.6), transparent); }
        .slot-window::after { top: auto; bottom: 0; background: linear-gradient(to top, rgba(0,0,0,0.6), transparent); }
        .reel-container { position: relative; height: 100%; overflow: hidden; }
        #prize-reel-container { width: 66.66%; border-right: 2px solid rgba(0,0,0,0.3); }
        #quantity-reel-container { width: 33.33%; }
        .slot-reel { position: absolute; top: 0; left: 0; width: 100%; }
        .reel-item { box-sizing: border-box; width: 100%; height: 21.833333cqw; display: flex; flex-direction: row; align-items: center; justify-content: flex-start; font-size: clamp(0.875rem, 6.67cqw, 1.5rem); line-height: 1.2; font-weight: bold; border-bottom: 2px dashed rgba(0,0,0,0.2); color: #333; padding: 0 clamp(6px, 5.56cqw, 20px); }
        .quantity-item { font-size: clamp(1.5rem, 11.11cqw, 2.5rem); justify-content: center; }
        .lever { position: absolute; top: 34%; width: clamp(44px, 13.33cqw, 80px); height: clamp(69px, 20.83cqw, 125px); cursor: pointer; transform-origin: 50% 100%; transform-style: preserve-3d; }
        #lever-right { right: 9%; }
        #lever-left { left: 8%; }
        .lever-arm { width: clamp(7px, 2cqw, 12px); height: clamp(55px, 16.67cqw, 100px); background: linear-gradient(to right, #ccc, #777); border-radius: 10px; position: absolute; bottom: 0; left: 42.5%; transform-origin: bottom center; transition: transform 0.4s ease-in-out; transform-style: preserve-3d; box-shadow: 2px 2px 5px rgba(0,0,0,0.4); }
        .lever-ball { width: clamp(18px, 5cqw, 30px); height: clamp(18px, 5cqw, 30px); background: radial-gradient(circle at 10px 10px, #FF6B6B, #C41E3A); border-radius: 50%; position: absolute; top: -2.5cqw; left: 50%; transform: translateX(-50%); box-shadow: inset 3px 3px 5px rgba(255,255,255,0.4), inset -3px -3px 5px rgba(0,0,0,0.4); transition: transform 0.4s ease-in-out; }
        .lever.pulled .lever-arm { transform: rotateX(-60deg); }
        .lever.pulled .lever-ball { transform: translateX(-50%) rotateX(60deg) scale(1.25); }
        @keyframes red-flash { 0%, 100% { box-shadow: inset 0 0 50px 25px rgba(255, 0, 0, 0), 0 0 10px rgba(255,0,0,0); } 50% { box-shadow: inset 0 0 50px 25px rgba(255, 0, 0, 0.7), 0 0 40px 10px rgba(255,0,0,0.7); } }
        .winner-flash { animation: red-flash 0.5s 6; }
        .modal-backdrop { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background-color: rgba(0, 0, 0, 0.5); display: flex; justify-content: center; align-items: center; z-index: 50; }
        .modal-content { background: white; padding: 2rem; border-radius: 12px; width: 90%; max-width: 500px; transition: background-color 0.5s ease; }
        .list-item > div, #winners-table > div { padding: 1rem; border-bottom: 1px solid #F3F4F6; }
        .list-item > div:last-child, #winners-table > div:last-child { border-bottom: none; }
        .quantity-list-item { position: relative; justify-content: flex-end; }
        .quantity-list-value { position: absolute; left: 50%; transform: translateX(-50%); }
        #winners-table > div { box-sizing: border-box; height: 2.4rem; padding-top: 0.3rem; padding-bottom: 0.3rem; }
        #winners-table { max-height: 7.2rem; overflow-y: auto; }
        #queue-list { max-height: 7.5rem; overflow-y: auto; }
        #queue-list li { height: 1.5rem; }
        #room-info { padding: 1.5rem; gap: 1.25rem; }
        #youtube-player { position: fixed; top: -9999px; left: -9999px; width: 200px; height: 200px; opacity: 0; pointer-events: none; }
        .page-title-row { display: grid; grid-template-columns: minmax(0, 1fr) auto minmax(0, 1fr); align-items: center; gap: 16px; }
        .page-title-row h1 { grid-column: 2; white-space: nowrap; }
        #youtube-player-controls { grid-column: 3; justify-self: end; }
        #toggle-music-btn { white-space: nowrap; }
        @media (min-width: 1024px) {
            #slot-machine-wrapper { margin-top: -3rem; }
        }
        @media (max-width: 640px) {
            .page-title-row { grid-template-columns: minmax(0, 1fr) auto; gap: 8px; }
            .page-title-row h1 { grid-column: 1; font-size: clamp(18px, 5.5vw, 28px); }
            #youtube-player-controls { grid-column: 2; }
            #toggle-music-btn { font-size: 12px; padding: 8px; }
        }
        
        /* 新增：當前玩家狀態指示 */
        .current-player-indicator { 
            position: absolute; 
            top: -10px; 
            left: 50%; 
            transform: translateX(-50%); 
            background: #FF6B6B; 
            color: white; 
            padding: 5px 15px; 
            border-radius: 20px; 
            font-size: 14px; 
            font-weight: bold;
            z-index: 10;
            animation: pulse 2s infinite;
        }
        
        @keyframes pulse {
            0% { transform: translateX(-50%) scale(1); }
            50% { transform: translateX(-50%) scale(1.05); }
            100% { transform: translateX(-50%) scale(1); }
        }
        
        /* 觀眾模式提示 */
        .spectator-mode { 
            opacity: 0.8; 
            pointer-events: none; 
        }
    </style>

<body class="p-4 sm:p-8">

    <div class="max-w-5xl mx-auto">
       <header class="text-center mb-10">
            <div class="page-title-row">
                <h1 class="text-4xl font-bold text-[#333]">分享AI🤩玩拉霸</h1>

            <div class="relative inline-flex items-center justify-center">
                <p class="text-lg mt-2 text-gray-500">China Motor Company . 生管部</p>
                <a href="https://yungkunchou.github.io/solt-machine-cloud/manual.html" target="_blank" rel="noopener noreferrer" class="absolute left-full ml-2 top-1/2 -translate-y-1/2 mt-1 text-gray-400 hover:text-gray-600 transition-colors" aria-label="使用者說明">
                    <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">

            <div id="slot-machine-wrapper" class="lg:w-3/5 lg:sticky lg:top-4">
                <div class="slot-machine">
                    <!-- 新增：當前玩家指示器 -->
                    <div id="current-player-indicator" class="current-player-indicator" style="display: none;"></div>
                    
                    <div class="slot-window-wrapper">

<script>
document.addEventListener('DOMContentLoaded', () => {
    // --- 1. 公共變數佈告欄 ---
    let prizes = [];
    let quantities = [];
    let winners = [];
    let socket = null;
    let roomId = null;
    let myPlayerId = null;
    let currentTurnPlayerId = null;
    let currentParticipantName = null;
    let activeTurnId = null;
    let completionPending = false;
    let amIDealer = false;
    let hasJoinedRoom = false;
    let joinGeneration = 0;
    let joinRetryTimeout = null;
    let dealerReplaced = false;
    let latestRoomState = null;
    let pendingRemoval = null;
    let watchOnly = false;
    let wasRemoved = false;
    let participantSessionUnavailable = false;
    let isInitialRender = true; // 【新增】增加一個旗標來判斷是否為首次渲染

    // 滾輪狀態變數，與您「雙滾輪」設計完全同步
    const reelStates = {
        prize: { isSpinning: false, isStopping: false, spinEndTimeout: null, finalResult: null, hasBeenSpun: false },
        quantity: { isSpinning: false, isStopping: false, spinEndTimeout: null, finalResult: null, hasBeenSpun: false }
    };

    function resetLocalRound() {
        activeTurnId = null;
        completionPending = false;
        for (const state of Object.values(reelStates)) {
            clearTimeout(state.spinEndTimeout);
            state.stopCleanup?.();
            Object.assign(state, { isSpinning: false, isStopping: false, isRequesting: false,
                finalResult: null, hasBeenSpun: false, hasStopped: false, stopConfirmed: false,
                stopPending: false, isShowingResult: false });
        }
    }
    
    // --- 2. DOM 元件定義區 (來自您的原始碼，完整無缺) ---
    const participantNameInput = document.getElementById('participant-name');
    const drawStatus = document.getElementById('draw-status');
    const leverLeft = document.getElementById('lever-left');
    const leverRight = document.getElementById('lever-right');
    const prizeReel = document.getElementById('prize-reel');
    const quantityReel = document.getElementById('quantity-reel');
    const slotWindow = document.getElementById('slot-window');
    const winnersTable = document.getElementById('winners-table');
    const exportCsvBtn = document.getElementById('export-csv-btn');
    const roomUrlInput = document.getElementById('room-url-input');
    const prizeManagementSection = document.getElementById('prize-management');
    const winnersSection = document.getElementById('winners-section');
    const dealerShareInfo = document.getElementById('dealer-share-info');
    const currentPlayerIndicator = document.getElementById('current-player-indicator');
    const settingsEditor = window.createLotterySettingsEditor(prizeManagementSection, payload => new Promise((resolve, reject) => {
        if (!socket?.connected || !hasJoinedRoom) { reject(new Error('連線已中斷，草稿仍保留，請重新連線後再試。')); return; }
        socket.timeout(6000).emit('updateSettings', { roomId, ...payload }, (error, result) => {
            if (error) reject(new Error('未收到儲存確認，草稿仍保留。請確認連線與後端版本後再試。'));
            else if (!result?.success) reject(new Error(result?.message || '儲存失敗，草稿仍保留。'));
            else resolve(result);
        });
    }));

    // --- 3. 函式定義區 ---

    function queueMessage(message, kind = 'error') {
        const feedback = document.getElementById('queue-feedback');
        feedback.textContent = message;
        feedback.dataset.kind = kind;
        feedback.hidden = !message;
    }

    function showSpectatorNotice() {
        const notice = document.getElementById('queue-spectator-notice');
        notice.hidden = !watchOnly || amIDealer;
        notice.textContent = participantSessionUnavailable
            ? '此瀏覽器無法保存分頁身分，目前僅能觀看。請允許此網站使用儲存空間，再重新整理以加入隊伍。'
            : '你已被莊家移出隊伍，目前可繼續觀看；此分頁重新整理後不會自動加入隊伍。';
        participantNameInput.disabled = watchOnly || amIDealer;
        participantNameInput.placeholder = amIDealer ? '您是莊家，不參加抽獎'
            : watchOnly ? '目前為觀看模式' : '在此輸入姓名…';
    }

    function renderPlayerStatus(turnChanged = false) {
        const roomState = latestRoomState;
        if (!roomState) return;
        participantNameInput.disabled = watchOnly || amIDealer || roomState.currentTurnData.playerId === myPlayerId;
        if (amIDealer) {
            drawStatus.textContent = '這是莊家頁面，邀請玩家刷QR Code加入遊戲';
        } else if (watchOnly) {
            drawStatus.textContent = '觀看模式';
        } else if (currentTurnPlayerId === myPlayerId) {
            drawStatus.textContent = currentParticipantName ? `你好, ${currentParticipantName}！請拉動拉桿！` : '輪到你了！請先輸入姓名！';
            if (turnChanged) {
                reelStates.prize.hasBeenSpun = false;
                reelStates.quantity.hasBeenSpun = false;
            }
        } else if (currentTurnPlayerId) {
            const currentPlayerName = roomState.players[currentTurnPlayerId]?.name || '下一位玩家';
            const ahead = roomState.queue.indexOf(myPlayerId);
            drawStatus.textContent = `現在輪到 ${currentPlayerName}...` +
                (ahead > 0 ? ` 再等 ${ahead} 人就輪到您了` : '');
        } else {
            drawStatus.textContent = winners.some(winner => winner.playerId === myPlayerId)
                ? '您已完成抽獎。' : '目前沒有等待中的玩家。';
        }
    }

    function enterSpectator() {
        const newlyRemoved = !wasRemoved;
        wasRemoved = true;
        watchOnly = true;
        if (newlyRemoved) {
            window.LOTTERY_PLAYER_SESSION.markRemoved(roomId);
            resetLocalRound();
        }
        showSpectatorNotice();
    }

    function renderQueue() {
        if (!latestRoomState) return;
        const roomState = latestRoomState;
        const queueList = document.getElementById('queue-list');
        queueList.innerHTML = '';
        document.getElementById('queue-count').textContent = `${roomState.queue.length} 人`;
        document.getElementById('queue-empty').hidden = roomState.queue.length > 0;
        if (!amIDealer) document.getElementById('queue-feedback').hidden = true;
        roomState.queue.forEach((playerId, index) => {
            const player = roomState.players[playerId];
            const playerName = player?.name || `玩家 #${index + 1}`;
            const active = roomState.currentTurnData.id != null && roomState.currentTurnData.playerId === playerId;
            const li = document.createElement('li');
            li.className = active ? 'queue-active' : '';
            const number = document.createElement('span');
            number.className = 'queue-number'; number.textContent = String(index + 1);
            const name = document.createElement('span');
            name.className = playerId === myPlayerId ? 'queue-name queue-self' : 'queue-name';
            name.textContent = playerName + (playerId === myPlayerId ? '（你）' : '');
            if (!player?.name) {
                const subtitle = document.createElement('span');
                subtitle.className = 'queue-subtitle'; subtitle.textContent = '尚未填姓名';
                name.appendChild(subtitle);
            }
            li.appendChild(number); li.appendChild(name);
            if (active) {
                const status = document.createElement('span'); status.className = 'queue-locked';
                const icon = document.createElement('span'); icon.className = 'queue-icon'; icon.setAttribute('aria-hidden', 'true');
                const label = document.createElement('span'); label.textContent = '抽獎中';
                status.appendChild(icon); status.appendChild(label); li.appendChild(status);
            } else if (amIDealer) {
                const remove = document.createElement('button');
                remove.type = 'button'; remove.className = 'queue-remove';
                remove.textContent = pendingRemoval === playerId ? '…' : 'X';
                remove.setAttribute('aria-label', `將${playerName}移出隊伍`);
                remove.setAttribute('aria-busy', String(pendingRemoval === playerId));
                remove.title = pendingRemoval === playerId ? '正在移出' : `將${playerName}移出隊伍`;
                remove.disabled = !socket?.connected || !hasJoinedRoom || pendingRemoval !== null;
                remove.addEventListener('click', () => removeQueuedPlayer(playerId));
                li.appendChild(remove);
            }
            queueList.appendChild(li);
        });
    }

    function removeQueuedPlayer(playerId) {
        if (!amIDealer || !socket?.connected || !hasJoinedRoom || pendingRemoval !== null) return;
        pendingRemoval = playerId;
        const generation = joinGeneration;
        queueMessage('');
        renderQueue();
        socket.timeout(6000).emit('removeQueuedPlayer', { roomId, playerId }, (error, result) => {
            if (generation !== joinGeneration || !amIDealer) return;
            pendingRemoval = null;
            if (error) queueMessage('未收到移出確認，請查看最新列表；若玩家仍在隊伍中，可再試一次。', 'error');
            else if (!result?.success) queueMessage(result?.message || '無法移出玩家，請查看最新列表。', 'error');
            else queueMessage('');
            renderQueue();
        });
    }

    function initializeMultiplayer() {
        const backendUrl = window.LOTTERY_CONFIG.backendUrl;
        socket = io(backendUrl);
        const urlParams = new URLSearchParams(window.location.search);
        roomId = urlParams.get('room');

        if (!roomId) {
            document.body.innerHTML = '<h1 class="text-4xl text-center p-12">錯誤：無效的房間ID！<br>請從您的入口網站 (index.html) 建立新遊戲。</h1>';
            return;
        }
        
        socket.on('connect', () => {
            if (dealerReplaced) { socket.disconnect(); return; }
            myPlayerId = socket.id;
            hasJoinedRoom = false;
            const generation = ++joinGeneration;
            clearTimeout(joinRetryTimeout);
            console.log('成功連接到遊戲大腦，我的ID是:', myPlayerId);
            drawStatus.textContent = '正在加入房間…';
            const dealerToken = window.LOTTERY_ROOM_SESSION.read(roomId);
            const participantSession = dealerToken ? null : window.LOTTERY_PLAYER_SESSION.prepare(roomId);
            participantSessionUnavailable = !dealerToken && !participantSession;
            wasRemoved = wasRemoved || !!participantSession?.removed;
            watchOnly = !dealerToken && (wasRemoved || participantSessionUnavailable);
            showSpectatorNotice();
            function join(attempt = 1) {
                socket.timeout(6000).emit('joinRoom', {
                    roomId, dealerToken, participantToken: participantSession?.token, spectator: watchOnly
                }, (error, result) => {
                    if (generation !== joinGeneration || !socket.connected || dealerReplaced) return;
                    if (error && attempt < 3) {
                        joinRetryTimeout = setTimeout(() => join(attempt + 1), 1000);
                        return;
                    }
                    if (error || !result?.success) {
                        settingsEditor.disconnect();
                        drawStatus.textContent = result?.message || '未收到加入確認，請確認前後端已更新，再重新整理頁面。';
                        return;
                    }
                    if (watchOnly && result.role !== 'spectator' && result.role !== 'dealer') {
                        socket.disconnect();
                        drawStatus.textContent = '服務尚未支援觀看模式，請莊家更新後端後再試。';
                        return;
                    }
                    if (result.role === 'spectator' && !participantSessionUnavailable) enterSpectator();
                    hasJoinedRoom = true;
                    renderQueue();
                });
            }
            join();
            const shareUrl = new URL(window.location.href);
            shareUrl.search = '';
            shareUrl.hash = '';
            shareUrl.searchParams.set('room', roomId);
            document.getElementById('qrcode').innerHTML = '';
            roomUrlInput.value = shareUrl.href;
            new QRCode(document.getElementById('qrcode'), shareUrl.href);
        });

        socket.on('disconnect', () => {
            ++joinGeneration;
            clearTimeout(joinRetryTimeout);
            hasJoinedRoom = false;
            amIDealer = false;
            pendingRemoval = null;
            renderQueue();
            settingsEditor.disconnect();
            resetLocalRound();
            currentParticipantName = null;
            prizeManagementSection.style.display = 'none';
            dealerShareInfo.style.display = 'none';
            exportCsvBtn.style.display = 'none';
            if (!dealerReplaced) drawStatus.textContent = watchOnly ? '觀看連線中斷，正在重新連線…' : '連線中斷，正在重新連線…';
        });
        socket.on('dealerReplaced', (data) => {
            if (data?.roomId !== roomId) return;
            dealerReplaced = true;
            window.LOTTERY_HISTORY.stop();
            window.LOTTERY_ROOM_SESSION.remove(roomId);
            socket.disconnect();
            drawStatus.textContent = '主持權已在另一個分頁恢復，請使用最新的主持人分頁。';
        });
        socket.on('connect_error', () => settingsEditor.disconnect());
        socket.on('removedFromQueue', data => {
            if (data?.roomId !== roomId || dealerReplaced || amIDealer) return;
            enterSpectator();
        });
        socket.on('updateRoomState', (roomState) => {
            if (dealerReplaced) return;
            latestRoomState = roomState;
            const turnChanged = currentTurnPlayerId !== roomState.queue[0];
            if (turnChanged) resetLocalRound();
            const settingsChanged = JSON.stringify(prizes) !== JSON.stringify(roomState.prizes) || JSON.stringify(quantities) !== JSON.stringify(roomState.quantities);
            console.log("收到房間狀態更新:", roomState);
            prizes = roomState.prizes;
            quantities = roomState.quantities;
            winners = roomState.winners;
            currentTurnPlayerId = roomState.queue[0];
            amIDealer = (myPlayerId === roomState.dealerId);
            if (!amIDealer && roomState.players[myPlayerId]?.removed && !participantSessionUnavailable) enterSpectator();
            if (amIDealer) watchOnly = false;
            showSpectatorNotice();
            window.LOTTERY_HISTORY.track(roomState, amIDealer);
            const registeredName = roomState.players[myPlayerId]?.name || null;
            if (registeredName !== currentParticipantName) participantNameInput.value = registeredName || '';
            currentParticipantName = registeredName;
            settingsEditor.update(roomState, amIDealer);

            prizeManagementSection.style.display = amIDealer ? 'block' : 'none';
            dealerShareInfo.style.display = amIDealer ? 'block' : 'none';
            winnersSection.style.display = 'block';
            exportCsvBtn.style.display = amIDealer ? 'inline-block' : 'none';
            
            // 更新當前玩家指示器
            updateCurrentPlayerIndicator(roomState);
            
            renderQueue();
            
            renderPlayerStatus(turnChanged);
            
            // ★★★ 關鍵修正：檢查是否有滾輪正在顯示結果，如果有就跳過重新渲染 ★★★
            const isShowingAnyResult = reelStates.prize.isShowingResult || reelStates.quantity.isShowingResult;
            const isAnySpinning = reelStates.prize.isSpinning || reelStates.quantity.isSpinning;
            
            // ★★★ 關鍵修正：使用 isInitialRender 旗標來決定是否在初次載入時渲染滾輪 ★★★
            if (isInitialRender) {
                console.log('✅ 執行首次完整渲染 (包含滾輪)');
                renderAll({ reRenderReels: true }); // 首次載入，強制渲染滾輪
                isInitialRender = false; // 將旗標設為 false，之後就不會再進來了
             } else if (isShowingAnyResult) {
               console.log('⚠️ 跳過房間狀態更新的滾輪渲染 - 正在顯示獲獎結果');
               renderWinners();
             } else {
               console.log('🔄 執行後續的狀態更新渲染 (不包含滾輪)');
               renderAll({ reRenderReels: settingsChanged && !isAnySpinning }); // 後續更新，不重繪滾輪，避免畫面跳動
             }
        });

        // ★★★ 新增：接收動畫同步指令 ★★★
        socket.on('animationSync', (data) => {
            console.log('收到動畫同步指令:', data);
            handleAnimationSync(data);
        });
        
        socket.on('nameError', (message) => {
            alert(message);
            participantNameInput.value = currentParticipantName || '';
            renderPlayerStatus();
        });
        socket.on('error', (msg) => alert('錯誤：' + msg));
    }

    // ★★★ 新增：處理同步動畫的函式 ★★★
    function handleAnimationSync(data) {
        const { action, type, playerId, playerName } = data;
        
        if (action === 'leverPull') {
            // 同步拉桿動畫
            const leverEl = type === 'prize' ? leverLeft : leverRight;
            leverEl.classList.add('pulled');
            
            // 如果不是自己在玩，顯示觀眾模式
            if (playerId !== myPlayerId) {
                slotWindow.classList.add('spectator-mode');
            }
            
        } else if (action === 'startSpin') {
            // 同步開始滾動動畫
            syncStartSpin(type);
            
        } else if (action === 'stopSpin') {
            // 同步停止滾動動畫
            syncStopSpin(type, data.finalResult, data.isAuto);
            
        } else if (action === 'winner') {
            // 同步得獎特效
            slotWindow.classList.add('winner-flash');
            setTimeout(() => {
                slotWindow.classList.remove('winner-flash');
                slotWindow.classList.remove('spectator-mode');
            }, 4000);
        }
    }

    // ★★★ 新增：更新當前玩家指示器 ★★★
    function updateCurrentPlayerIndicator(roomState) {
        const currentPlayer = roomState.players[currentTurnPlayerId];
        if (currentPlayer && currentPlayer.name) {
            currentPlayerIndicator.textContent = `${currentPlayer.name} 正在抽獎`;
            currentPlayerIndicator.style.display = 'block';
        } else {
            currentPlayerIndicator.style.display = 'none';
        }
    }

    // ★★★ 新增：同步滾動開始動畫 ★★★
    function syncStartSpin(type) {
        const state = reelStates[type];
        const reelEl = type === 'prize' ? prizeReel : quantityReel;
        const windowHeight = reelEl.parentElement.offsetHeight;
        
        // 確保滾輪內容是最新的
        if (type === 'prize') {
            renderPrizeReel();
        } else {
            renderQuantityReel();
        }

        reelEl.style.transition = 'none';
        reelEl.style.transform = 'translateY(0px)';
        void reelEl.offsetWidth; // 強制重繪

        const spinDuration = 5000;
        reelEl.style.transition = `transform ${spinDuration}ms linear`;
        reelEl.style.transform = `translateY(-${reelEl.scrollHeight - windowHeight}px)`;
    }

    // ★★★ 新增：同步滾動停止動畫 ★★★  
    function syncStopSpin(type, finalResult, isAuto = false) {
        const reelEl = type === 'prize' ? prizeReel : quantityReel;
        const reelItems = Array.from(reelEl.querySelectorAll('.reel-item'));
        if(reelItems.length === 0) return;
        
        const itemHeight = reelItems[0].offsetHeight;
        const windowHeight = reelEl.parentElement.offsetHeight;
        const style = window.getComputedStyle(reelEl);
        const matrix = new DOMMatrixReadOnly(style.transform);
        const currentY = matrix.m42;
        const currentItemIndex = Math.round(Math.abs(currentY) / itemHeight);
        
        let finalTargetIndex = -1;
        for(let i = currentItemIndex + 5; i < reelItems.length; i++) {
            if (reelItems[i] && reelItems[i].dataset.name === finalResult) {
                finalTargetIndex = i;
                break;
            }
        }
        
        if (finalTargetIndex === -1) {
            const newReelItems = Array.from(reelEl.querySelectorAll('.reel-item'));
            for(let i = 0; i < newReelItems.length; i++) {
                 if (newReelItems[i] && newReelItems[i].dataset.name === finalResult) {
                    finalTargetIndex = i + Math.floor(newReelItems.length / 2);
                    break;
                }
            }
            if (finalTargetIndex === -1) finalTargetIndex = currentItemIndex + 10;
        }
        
        const targetPosition = finalTargetIndex * itemHeight;
        const centeredPosition = targetPosition - (windowHeight / 2) + (itemHeight / 2);
        const stopDuration = 2500 + Math.random() * 1000;
        
        reelEl.style.transition = `transform ${stopDuration}ms cubic-bezier(0.23, 1, 0.32, 1)`;
        reelEl.style.transform = `translateY(-${centeredPosition}px)`;
        
        // 拉桿回位時機
        const leverEl = type === 'prize' ? leverLeft : leverRight;
        if (isAuto) {
            setTimeout(() => leverEl.classList.remove('pulled'), stopDuration - 400);
        } else {
            leverEl.classList.remove('pulled');
        }
    }

    function checkAndRecordWin() {
        if (completionPending || activeTurnId === null ||
            !Object.values(reelStates).every(state => state.hasStopped && state.stopConfirmed &&
                !state.isSpinning && !state.isStopping && state.finalResult !== null)) return;
        const turnId = activeTurnId;
        completionPending = true;
        socket.timeout(6000).emit('turnComplete', { roomId, turnId }, (error, result) => {
            if (error || !result?.success) {
                if (activeTurnId === turnId) {
                    completionPending = false;
                    drawStatus.textContent = result?.message || '未收到完成確認，請再按拉桿重試。';
                }
                return;
            }
            slotWindow.classList.add('winner-flash');
            setTimeout(() => {
                slotWindow.classList.remove('winner-flash');
                slotWindow.classList.remove('spectator-mode');
            }, 4000);
        });
    }

    function confirmReelStopped(type, turnId) {
        const state = reelStates[type];
        if (activeTurnId !== turnId || state.stopPending) return;
        state.stopPending = true;
        socket.timeout(6000).emit('reelStopped', { roomId, turnId, type }, (error, result) => {
            if (activeTurnId !== turnId) return;
            state.stopPending = false;
            if (error || !result?.success) {
                drawStatus.textContent = '未收到滾輪停止確認，請再按該拉桿重試。';
                return;
            }
            state.stopConfirmed = true;
            checkAndRecordWin();
        });
    }

    function finalizeSpin(type, turnId) {
        const state = reelStates[type];
        if (activeTurnId !== turnId || state.hasStopped || !state.isStopping) return;
        state.stopCleanup?.();
        state.isSpinning = false;
        state.isStopping = false;
        state.hasStopped = true;
        state.isShowingResult = true;
        confirmReelStopped(type, turnId);
    }
            
    function startSlowingDown(type, isAuto = false) {
        const state = reelStates[type];
        if (!state.isSpinning || state.isStopping || state.finalResult === null) return;
        state.isStopping = true;
        clearTimeout(state.spinEndTimeout);
        const turnId = activeTurnId;
        
        // ★★★ 修正：廣播停止動畫時傳遞正確的結果 ★★★
        socket.emit('broadcastAnimation', {
            roomId,
            turnId,
            action: 'stopSpin',
            type,
            isAuto
        });

        const reelEl = type === 'prize' ? prizeReel : quantityReel;
        const reelItems = Array.from(reelEl.querySelectorAll('.reel-item'));
        if(reelItems.length === 0) return;
        const itemHeight = reelItems[0].offsetHeight;
        const windowHeight = reelEl.parentElement.offsetHeight;
        const style = window.getComputedStyle(reelEl);
        const matrix = new DOMMatrixReadOnly(style.transform);
        const currentY = matrix.m42;
        const currentItemIndex = Math.round(Math.abs(currentY) / itemHeight);
        const wonResult = state.finalResult;
        let finalTargetIndex = -1;
        
        // ★★★ 實際玩家也使用相同的邏輯確保結果正確 ★★★
        for(let i = currentItemIndex + 5; i < reelItems.length; i++) {
            if (reelItems[i] && reelItems[i].dataset.name === wonResult) {
                finalTargetIndex = i;
                break;
            }
        }
        if (finalTargetIndex === -1) {
            for(let i = 0; i < reelItems.length; i++) {
                if (reelItems[i] && reelItems[i].dataset.name === wonResult) {
                    finalTargetIndex = Math.max(i, currentItemIndex + 8);
                    break;
                }
            }
        }
        
        // 如果仍然沒找到，強制創建
        if (finalTargetIndex === -1) {
            console.warn(`玩家端警告：無法找到結果 "${wonResult}"，強制添加`);
            const newItem = document.createElement('div');
            newItem.className = type === 'prize' ? 'reel-item' : 'reel-item quantity-item';
            newItem.dataset.name = wonResult;
            
            if (type === 'prize') {
                newItem.textContent = wonResult;
            } else {
                newItem.textContent = wonResult;
            }
            
            const insertPosition = currentItemIndex + 8;
            if (reelItems[insertPosition]) {
                reelItems[insertPosition].parentNode.insertBefore(newItem, reelItems[insertPosition]);
            } else {
                reelEl.appendChild(newItem);
            }
            finalTargetIndex = insertPosition;
        }
        
        const targetPosition = finalTargetIndex * itemHeight;
        const centeredPosition = targetPosition - (windowHeight / 2) + (itemHeight / 2);
        const stopDuration = 2500 + Math.random() * 1000;
        reelEl.style.transition = `transform ${stopDuration}ms cubic-bezier(0.23, 1, 0.32, 1)`;
        reelEl.style.transform = `translateY(-${centeredPosition}px)`;
        
        const leverEl = type === 'prize' ? leverLeft : leverRight;
        if (isAuto) {
            setTimeout(() => leverEl.classList.remove('pulled'), stopDuration - 400);
        } else {
            leverEl.classList.remove('pulled');
        }

        const onTransitionEnd = event => {
            if (event.target === reelEl && event.propertyName === 'transform') finalizeSpin(type, turnId);
        };
        reelEl.addEventListener('transitionend', onTransitionEnd);
        // Background tabs and disabled transitions may not deliver transitionend.
        const stopTimeout = setTimeout(() => finalizeSpin(type, turnId), stopDuration + 100);
        state.stopCleanup = () => {
            clearTimeout(stopTimeout);
            reelEl.removeEventListener('transitionend', onTransitionEnd);
            state.stopCleanup = null;
        };
        
        console.log(`玩家停止滾輪 ${type}，結果：${wonResult}，位置：${finalTargetIndex}`);
    }
            
    function handleSpin(type) {
        if (!socket.connected || !hasJoinedRoom || amIDealer || watchOnly || currentTurnPlayerId !== myPlayerId || !currentParticipantName) return;
        const state = reelStates[type];
        if (state.isRequesting) return;
        if (state.hasStopped) {
            if (!state.stopConfirmed) confirmReelStopped(type, activeTurnId);
            else checkAndRecordWin();
            return;
        }
        
        // 優先處理「手動煞停」
        if (state.isSpinning && !state.isStopping) {
            clearTimeout(state.spinEndTimeout);
            startSlowingDown(type, false);
            return;
        }

        if (state.isSpinning) return;
        
        if (state.hasBeenSpun) {
            drawStatus.textContent = `這個滾輪您已經抽過了喔！`; return;
        }

        state.isRequesting = true;
        const requestingPlayerId = myPlayerId;
        socket.timeout(6000).emit('spin', { roomId, type }, (error, result) => {
            if (!socket.connected || myPlayerId !== requestingPlayerId || currentTurnPlayerId !== requestingPlayerId) return;
            state.isRequesting = false;
            if (error || !result?.success || !Number.isInteger(result.turnId)) {
                drawStatus.textContent = result?.message || '未收到抽獎確認，請再按拉桿重試。';
                return;
            }
            if (activeTurnId !== null && activeTurnId !== result.turnId) return;
            activeTurnId = result.turnId;
            state.finalResult = result.result;
            startAcceptedSpin(type);
        });
    }

    function startAcceptedSpin(type) {
        const state = reelStates[type];
        state.hasBeenSpun = true;
        state.hasStopped = false;
        state.stopConfirmed = false;
        state.isStopping = false;
        state.isShowingResult = false;
        socket.emit('broadcastAnimation', { roomId, turnId: activeTurnId, action: 'leverPull', type });
        
        (type === 'prize' ? leverLeft : leverRight).classList.add('pulled');
        drawStatus.textContent = '祝您好運！再次拉動拉桿即可煞停！';
        
        // ★★★ 修改：廣播滾動開始動畫 ★★★
        socket.emit('broadcastAnimation', {
            roomId,
            turnId: activeTurnId,
            action: 'startSpin',
            type
        });
        
        const reelEl = type === 'prize' ? prizeReel : quantityReel;
        const windowHeight = reelEl.parentElement.offsetHeight;
        
        if (type === 'prize') renderPrizeReel();
        else renderQuantityReel();

        state.isSpinning = true; // << 將狀態設定移到渲染之後！

        reelEl.style.transition = 'none';
        reelEl.style.transform = 'translateY(0px)';
        void reelEl.offsetWidth;

        const spinDuration = 5000;
        reelEl.style.transition = `transform ${spinDuration}ms linear`;
        reelEl.style.transform = `translateY(-${reelEl.scrollHeight - windowHeight}px)`;

        // 設定「自動煞停」計時器
        state.spinEndTimeout = setTimeout(() => {
            startSlowingDown(type, true);
        }, spinDuration - 1000);
    }

    function renderAll(options = {}) {
        const { reRenderReels = true } = options;
        if (reRenderReels) {
            renderPrizeReel();
            renderQuantityReel();
        }
        renderWinners();
    }

    const escapeHTML = value => String(value).replace(/[&<>"']/g, ch => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[ch]));
    function renderPrizeReel() {
        if (reelStates.prize.isSpinning || reelStates.prize.isStopping) return;
        if (prizes.length === 0) { prizeReel.innerHTML = `<div class="reel-item" style="height: 100%; color: red; justify-content: center;">請先設定獎項</div>`; return; }
        const shuffledPrizes = [...prizes].sort(() => Math.random() - 0.5);
        const repeatCount = Math.max(10, Math.ceil(80 / prizes.length));
        const displayItems = Array(repeatCount).fill(shuffledPrizes).flat();
        prizeReel.innerHTML = displayItems.map(prize => `<div class="reel-item" data-name="${escapeHTML(prize.name)}"><span>${escapeHTML(prize.name)}</span></div>`).join('');
    }
    function renderQuantityReel() {
        if (reelStates.quantity.isSpinning || reelStates.quantity.isStopping) return;
        if (quantities.length === 0) { quantityReel.innerHTML = ''; return; }
        const shuffledQuantities = [...quantities].sort(() => Math.random() - 0.5);
        const repeatCount = Math.max(10, Math.ceil(80 / quantities.length));
        const displayItems = Array(repeatCount).fill(shuffledQuantities).flat();
        quantityReel.innerHTML = displayItems.map(q => `<div class="reel-item quantity-item" data-name="${escapeHTML(q.name)}">${escapeHTML(q.name)}</div>`).join('');
    }
    function renderWinners() {
        winnersTable.innerHTML = winners.length ? '' : '<div class="text-center text-gray-500 p-4 col-span-3">目前尚無得獎者。</div>';
        [...winners].reverse().forEach(winner => {
            const row = document.createElement('div');
            row.className = 'grid grid-cols-8 items-center';
            row.innerHTML = `<div class="col-span-2">${escapeHTML(winner.name)}</div><div class="col-span-5">${escapeHTML(winner.prize)}</div><div class="text-center col-span-1">${escapeHTML(winner.quantity)}</div>`;
            winnersTable.appendChild(row);
        });
    }
    let player;
    let isMusicPlaying = false;
    let isMusicPlayerReady = false;
    const setMusicButton = (isPlaying) => {
        isMusicPlaying = isPlaying;
        document.getElementById('toggle-music-btn').textContent = isPlaying ? '🔊 關閉背景音樂' : '🔇 開啟背景音樂';
    };
    window.onYouTubeIframeAPIReady = function() {
        player = new YT.Player('youtube-player', {
            height: '200',
            width: '200',
            videoId: 'P4YzQmd9tZo',
            playerVars: { listType: 'playlist', list: 'PLbYHhP_Esm05t_qgCEeI9K3-8WECKWxDD', loop: 1, playsinline: 1 },
            events: {
                onReady: (event) => { isMusicPlayerReady = true; event.target.setVolume(50); setMusicButton(false); },
                onStateChange: (event) => {
                    if (event.data === YT.PlayerState.PLAYING) setMusicButton(true);
                    if (event.data === YT.PlayerState.PAUSED || event.data === YT.PlayerState.ENDED) setMusicButton(false);
                }
            }
        });
    };

    // --- 4. 事件綁定區 ---
    function submitParticipantName() {
        if (amIDealer || watchOnly || !socket?.connected || !hasJoinedRoom) return;
        const name = participantNameInput.value.trim();
        if (!name || name === currentParticipantName) return;
        socket.emit('setPlayerName', { roomId, name });
        drawStatus.textContent = '正在確認姓名…';
    }
    participantNameInput.addEventListener('change', submitParticipantName);
    participantNameInput.addEventListener('keydown', event => {
        if (event.key !== 'Enter' || event.isComposing || event.keyCode === 229) return;
        event.preventDefault();
        submitParticipantName();
    });
    leverLeft.addEventListener('click', () => handleSpin('prize'));
    leverRight.addEventListener('click', () => handleSpin('quantity'));
    exportCsvBtn.addEventListener('click', () => {
        if (winners.length === 0) return;
        window.LOTTERY_HISTORY.download(winners);
    });
    document.getElementById('toggle-music-btn').addEventListener('click', () => {
        if (!player || !isMusicPlayerReady) {
            document.getElementById('toggle-music-btn').textContent = '音樂載入中...';
            return;
        }
        if (isMusicPlaying) { player.pauseVideo(); setMusicButton(false); }
        else { player.playVideo(); setMusicButton(true); }
    });

    // --- 5. 程式啟動區 ---
    initializeMultiplayer();
});
</script>
<script type="text/javascript" src="https://www.youtube.com/iframe_api"></script>
